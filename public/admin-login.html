<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nexora — Admin Login</title>
<link rel="stylesheet" href="./css/style.css"/>
<link rel="icon" type="image/svg+xml" href="./favicon.svg"/>
<link rel="apple-touch-icon" href="./favicon.svg"/>
</head>
<body>
<header class="header"><div class="container header-inner">
  <a class="brand" href="./index.html"><span class="brand-mark">N</span><span>Nexora<small>Trading IA</small></span></a>
  <div class="header-actions" style="display:flex"><a class="btn btn-ghost" href="./index.html" style="padding:9px 16px">← Voltar ao site</a><a class="btn btn-primary" href="./login.html" style="padding:9px 16px">Login Usuário</a></div>
</div></header>
<main class="auth-wrap"><div class="auth-card">
  <a class="brand" href="./index.html"><span class="brand-mark">N</span><span>Nexora</span></a>
  <h1>Painel Administrativo</h1>
  <p class="sub">Acesso restrito a administradores. Mesmo acesso da conta usuário, com validação <code>is_admin</code>.</p>
  <div class="alert" id="alert"></div>
  <form id="loginForm" novalidate>
    <div class="field"><label for="login">Usuário ou e-mail</label><input id="login" type="text" placeholder="admin" autocomplete="username" required/></div>
    <div class="field"><label for="password">Senha</label><input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required/></div>
    <button class="btn btn-primary btn-block" type="submit">Entrar no Admin</button>
  </form>
  <div class="auth-links"><a href="./login.html">← Login de usuário</a><span class="muted" style="font-size:12px">Credenciais: admin / Admin123!</span></div>
</div></main>
<script src="./js/admin-auth.js"></script>
</body>
</html>
